syntax = "proto3";

package solti.discover.v1;

import "solti/agent/v1/types.proto";

// Agent discovery and heartbeat.
service DiscoverService {
  // Sync registers the agent and reports its status.
  rpc Sync(SyncRequest) returns (SyncResponse);
}

// Transport an agent exposes for its API endpoint.
enum EndpointType {
  ENDPOINT_TYPE_UNSPECIFIED = 0; // invalid; rejected by the server
  ENDPOINT_TYPE_GRPC        = 1; // gRPC
  ENDPOINT_TYPE_HTTP        = 2; // HTTP
}

// One heartbeat from an agent.
message SyncRequest {
  string              id                   = 1;  // stable agent id
  string              name                 = 2;  // display name
  string              endpoint             = 3;  // address to reach the agent
  int64               uptime_seconds       = 4;  // seconds since the agent started
  string              os                   = 5;  // OS name
  string              arch                 = 6;  // CPU arch
  string              platform             = 7;  // OS family
  int64               ts                   = 8;  // send time (Unix seconds)
  map<string, string> metadata             = 9;  // agent-supplied tags
  EndpointType        endpoint_type        = 10; // transport for `endpoint`
  int32               api_version          = 11; // API version the agent speaks (1 = v1)
  int32               heartbeat_interval_s = 12; // agent's heartbeat period (seconds)

  solti.agent.v1.AgentCapabilities capabilities = 13; // registered runners and workload GVKs
}

// Reply to one heartbeat.
message SyncResponse {
  bool   success       = 1; // true if accepted
  string reason        = 2; // cause when success = false
  int32  retry_after_s = 3; // suggested wait before next Sync (seconds)
}
