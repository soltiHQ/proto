syntax = "proto3";

package solti.task.v1;

import "solti/task/v1/types.proto";

// Task management API exposed by the agent.
service TaskService {
  // Create a named Task resource.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  // Declaratively create or update one named Task resource.
  rpc ApplyTask(ApplyTaskRequest) returns (ApplyTaskResponse);

  // Get one Task resource.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // List tasks with optional filters and pagination.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // Watch task collection changes.
  rpc WatchTasks(WatchTasksRequest) returns (stream WatchTasksResponse);

  // List the attempt history of one task.
  rpc ListTaskRuns(ListTaskRunsRequest) returns (ListTaskRunsResponse);

  // Stop current reconciliation or request a terminal logical outcome for the
  // current runtime while retaining desired Task state and run history.
  // Cancellation does not suppress later reconciliation.
  // Force-aborted task code can remain physically active.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Request a terminal logical outcome and purge retained state.
  // Force-aborted task code can remain physically active.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);

  // Live-tail stdout/stderr events for a task.
  rpc StreamTaskLogs(StreamTaskLogsRequest) returns (stream StreamTaskLogsResponse);
}

// Optional identity and version checks for apply, cancel, and delete.
message WritePreconditions {
  optional string uid              = 1; // current resource UID
  optional string resource_version = 2; // current resourceVersion
}

// Stable category of a failed write precondition.
enum WriteConflictReason {
  WRITE_CONFLICT_REASON_UNSPECIFIED               = 0; // no conflict reason; never emitted intentionally
  WRITE_CONFLICT_REASON_UID_MISMATCH              = 1; // requested UID differs from the stored Task UID
  WRITE_CONFLICT_REASON_RESOURCE_VERSION_MISMATCH = 2; // requested resourceVersion differs from the stored revision
  WRITE_CONFLICT_REASON_PRECONDITION_FAILED       = 3; // failed precondition has no more specific v1 category
}

// One failed write precondition.
message WriteConflictCause {
  WriteConflictReason reason  = 1; // stable machine-readable category
  optional string     field   = 2; // related request field, when known
  string              message = 3; // readable diagnostic
}

// Structured details carried by an Aborted gRPC status for a write conflict.
message WriteConflictDetails {
  string                      name   = 1; // conflicting Task name
  repeated WriteConflictCause causes = 2; // failed write preconditions
}

// CreateTask desired-state input.
message CreateTaskRequest {
  TaskManifest manifest = 1; // desired Task manifest
}

// CreateTask output.
message CreateTaskResponse {
  Task task = 1; // created Task resource
}

// ApplyTask desired-state input.
message ApplyTaskRequest {
  TaskManifest       manifest      = 1; // desired Task manifest
  WritePreconditions preconditions = 2; // absent = unconditional upsert
}

// ApplyTask output.
message ApplyTaskResponse {
  Task task = 1; // current Task resource
}

// GetTask input.
message GetTaskRequest {
  string name = 1; // Task name
}

// GetTask output.
message GetTaskResponse {
  Task task = 1; // always present; an unknown name is returned as gRPC NotFound
}

// ListTasks input.
// Filters are ANDed; omitted filters match all.
// A non-empty continue token resumes the previous snapshot.
// Filters must be repeated unchanged.
message ListTasksRequest {
  reserved 4;
  reserved "offset";

  optional string    slot   = 1; // filter by slot
  repeated TaskPhase phases = 2; // OR; empty = all phases
  uint32             limit  = 3; // page size; zero = 100; maximum = 1000

  string label_selector = 5; // label-selector syntax
  string continue       = 6; // opaque token from the previous page
}

// ListTasks output.
message ListTasksResponse {
  reserved 2;
  reserved "total";

  repeated Task tasks = 1; // one page of tasks

  string resource_version              = 3; // opaque collection version captured with this page
  string continue                      = 4; // opaque token for the next page
  optional uint64 remaining_item_count = 5; // items left in this snapshot
}

// WatchTasks input.
// Filters are ANDed; omitted filters match all.
message WatchTasksRequest {
  optional string    slot             = 1; // filter by slot
  repeated TaskPhase phases           = 2; // OR; empty = all phases
  string             label_selector   = 3; // label-selector syntax
  optional string    resource_version = 4; // absent or "0" = current objects then changes
}

// Task collection watch event type.
enum TaskWatchEventType {
  TASK_WATCH_EVENT_TYPE_UNSPECIFIED = 0; // no event type
  TASK_WATCH_EVENT_TYPE_ADDED       = 1; // Task entered the watched collection
  TASK_WATCH_EVENT_TYPE_MODIFIED    = 2; // watched Task changed
  TASK_WATCH_EVENT_TYPE_DELETED     = 3; // Task left the watched collection
}

// One Task collection change.
message WatchTasksResponse {
  TaskWatchEventType type   = 1; // event type
  Task               object = 2; // Task snapshot for this event
}

// ListTaskRuns input.
// A non-empty continue token resumes the previous snapshot.
message ListTaskRunsRequest {
  string name     = 1; // Task name
  uint32 limit    = 2; // page size; zero = 100; maximum = 1000
  string continue = 3; // opaque token from the previous page
}

// ListTaskRuns output.
message ListTaskRunsResponse {
  repeated TaskRunInfo runs = 1; // attempts, oldest first

  string resource_version              = 2; // opaque run collection version captured with this page
  string continue                      = 3; // opaque token for the next page
  optional uint64 remaining_item_count = 4; // attempts left in this snapshot
  string          task_uid             = 5; // UID of the Task incarnation whose runs this snapshot contains
}

// CancelTask input.
message CancelTaskRequest {
  string             name          = 1; // Task name
  WritePreconditions preconditions = 2; // absent = no identity or version check
}

// CancelTask output. Empty on success.
message CancelTaskResponse {}

// DeleteTask input.
message DeleteTaskRequest {
  string             name          = 1; // Task name
  WritePreconditions preconditions = 2; // absent = no identity or version check
}

// DeleteTask output. Empty on success.
message DeleteTaskResponse {}

// StreamTaskLogs input.
message StreamTaskLogsRequest {
  string name     = 1; // Task name
  string task_uid = 2; // exact Task incarnation to subscribe to; required
}

// Source stream of a captured output line.
enum OutputStreamKind {
  OUTPUT_STREAM_KIND_UNSPECIFIED = 0; // no output stream
  OUTPUT_STREAM_KIND_STDOUT      = 1; // standard output
  OUTPUT_STREAM_KIND_STDERR      = 2; // standard error
}

// One captured line of process output.
message OutputChunk {
  uint64           generation = 1; // desired-state generation that produced the line
  uint32           attempt    = 2; // attempt within generation
  OutputStreamKind stream     = 3; // stdout or stderr
  uint64           seq        = 4; // per-stream sequence
  int64            ts         = 5; // time the agent read the line (ms)
  bytes            line       = 6; // exact retained line bytes, without the line delimiter
  bool             truncated  = 7; // true when source bytes were omitted from the end
}

// A new attempt started.
message RunStarted {
  uint64 generation = 1; // desired-state generation that started
  uint32 attempt    = 2; // attempt within generation
  int64  started_at = 3; // start time (ms)
}

// The current attempt ended. Stop accumulating its chunks.
message RunFinished {
  uint64         generation  = 1; // desired-state generation that ended
  uint32         attempt     = 2; // attempt within generation
  optional int32 exit_code   = 3; // process exit code, if available
  int64          finished_at = 4; // end time (ms)
}

// The subscriber fell behind and the server dropped events.
message Lagged {
  uint64 skipped       = 1; // number of events missed
  uint64 skipped_bytes = 2; // retained line bytes missed across those events
}

// One StreamTaskLogs event: exactly one field is set.
message StreamTaskLogsResponse {
  oneof kind {
    OutputChunk chunk        = 1; // output line
    RunStarted  run_started  = 2; // attempt started
    RunFinished run_finished = 3; // attempt ended
    Lagged      lagged       = 4; // events were dropped
  }
}
