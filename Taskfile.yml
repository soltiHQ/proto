version: '3'

includes:
  proto:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/v1/taskfiles/proto/Taskfile.yml

tasks:
  fmt:
    desc: Format Protobuf sources in place.
    cmds:
      - task: proto:format/fix

  ci/fmt:
    desc: Verify Protobuf formatting without changing files.
    cmds:
      - task: proto:format

  ci/lint:
    desc: Run 'buf lint'.
    cmds:
      - task: proto:lint

  ci/build:
    desc: Compile the schema with 'buf build'.
    cmds:
      - task: proto:build

  ci/breaking:
    desc: Detect breaking changes against main. Override with AGAINST=...
    cmds:
      - task: proto:breaking
