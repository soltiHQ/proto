version: '3'

includes:
  docs:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/v1/taskfiles/docs/Taskfile.yml
  proto:
    taskfile: https://raw.githubusercontent.com/soltiHQ/actions/v1/taskfiles/proto/Taskfile.yml

vars:
  docs_version:
    sh: tr -d '\r\n' < version

tasks:
  fmt:
    desc: Format Protobuf sources in place.
    cmds:
      - task: proto:format/fix

  ci/fmt:
    desc: Verify Protobuf formatting without changing files.
    cmds:
      - task: proto:format

  ci/lint:
    desc: Run 'buf lint'.
    cmds:
      - task: proto:lint

  ci/build:
    desc: Compile the schema with 'buf build'.
    cmds:
      - task: proto:build

  ci/breaking:
    desc: Detect breaking changes against main. Override with AGAINST=...
    cmds:
      - task: proto:breaking

  ci/docs:
    desc: Validate the versioned public contract guide.
    cmds:
      - task: docs:validate
        vars:
          VERSION: '{{.docs_version}}'
          PRODUCT: contracts
          TITLE: Solti API Contracts
          REPOSITORY: https://github.com/soltiHQ/proto
          VERSION_PROVIDER: input
          LINK_SOURCES: docs README.md
      - task: docs:links/external
        vars:
          LINK_SOURCES: docs README.md
